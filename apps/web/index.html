<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var storageKey = "boilerplate:theme";
          var stored = localStorage.getItem(storageKey);
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || ((stored !== "light" && stored !== "dark") && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f8fafc; }
      html.dark, html.dark body { background: #171717; }
      #relmes-auth-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #f8fafc; color: #64748b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      html.dark #relmes-auth-boot { background: #171717; color: #a3a3a3; }
      #relmes-auth-boot .spin {
        width: 36px; height: 36px; border-radius: 9999px;
        border: 2px solid #e2e8f0; border-top-color: #2563eb;
        animation: relmes-spin 0.7s linear infinite;
      }
      html.dark #relmes-auth-boot .spin { border-color: #303030; border-top-color: #60a5fa; }
      @keyframes relmes-spin { to { transform: rotate(360deg); } }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Apps / web</title>
  </head>
  <body>
    <div id="root">
      <div id="relmes-auth-boot">
        <div class="spin" aria-hidden="true"></div>
        <p style="margin:0;font-size:14px;">Authenticating user…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
